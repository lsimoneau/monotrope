  - type: grid
    cards:
    - type: heading
      heading: Watering
      icon: mdi:sprinkler-variant
    - type: custom:button-card
      template: zone_block
      entity: binary_sensor.veggie_garden_watering
      name: Veggie Garden
      custom_fields:
        info: >-
          [[[ const w = states['binary_sensor.veggie_garden_watering'].state === 'on'; const rem = states['sensor.veggie_garden_remaining_watering_time'].state; const n = states['sensor.veggie_garden_next_cycle'].state; const s = states['switch.veggie_garden_automatic_watering'].state === 'off'; let body; if (w) { body = `<span class="on">● ${rem}m left</span>`; } else if (s) { body = '<span>suspended</span>'; } else if (n === 'unknown' || n === 'unavailable') { body = '<span>idle</span>'; } else { const ns = new Date(n).toLocaleString('en-AU', {weekday: 'short', hour: '2-digit', minute: '2-digit'}); body = `<span>next ${ns}</span>`; } return `<div class="zone-info">${body}</div>`; ]]]
        actions:
          card:
            type: horizontal-stack
            cards:
            - type: custom:button-card
              template: zone_btn
              name: 30m
              icon: mdi:water
              tap_action:
                action: perform-action
                perform_action: hydrawise.start_watering
                data:
                  duration: 30
                target:
                  entity_id: binary_sensor.veggie_garden_watering
            - type: custom:button-card
