title: Home
button_card_templates:
  zone_block:
    show_icon: false
    show_state: false
    show_name: true
    tap_action:
      action: more-info
    styles:
      card:
        - padding: 10px 14px
      grid:
        - grid-template-areas: '"n info" "actions actions"'
        - grid-template-columns: auto 1fr
        - grid-template-rows: auto auto
        - grid-row-gap: 8px
        - grid-column-gap: 12px
        - align-items: baseline
      name:
        - justify-self: start
        - font-size: 14px
        - font-weight: 600
        - color: var(--primary-text-color)
      custom_fields:
        info:
          - justify-self: end
          - font-size: 12px
        actions:
          - justify-self: stretch
          - width: 100%
    extra_styles: |
      .zone-info { color: var(--secondary-text-color); }
      .zone-info .on { color: var(--success-color, #43a047); font-weight: 600; }
  zone_btn:
    show_icon: false
    show_name: true
    show_state: false
    styles:
      card:
        - padding: 5px 4px
        - min-height: 32px
      name:
        - font-size: 11px
        - font-weight: 600
views:
- title: Home
  path: home
  icon: mdi:home
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Heat Pump Hot Water
      icon: mdi:water-boiler
    - type: tile
      entity: water_heater.heat_pump_hot_water
      name: Mode
      features_position: bottom
      features:
      - type: water-heater-operation-modes
        operation_modes:
        - 'off'
        - eco
        - heat_pump
        - performance
    - type: sensor
      entity: sensor.heat_pump_hot_water_current_temperature
      name: Tank
      graph: line
      hours_to_show: 48
  - type: grid
    cards:
    - type: heading
      heading: AC
      icon: mdi:air-conditioner
    - type: tile
      entity: climate.ac
      name: Master
      features_position: bottom
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - 'off'
        - cool
        - heat
        - fan_only
      - type: climate-preset-modes
        preset_modes:
        - MyZone
        - MyTemp
        - MyAuto
        style: dropdown
  - type: grid
    cards:
    - type: heading
      heading: Weather
      icon: mdi:weather-partly-cloudy
    - type: weather-forecast
      entity: weather.forecast_home
      forecast_type: daily
      show_current: true
      show_forecast: true
  - type: grid
    cards:
    - type: heading
      heading: Energy
      icon: mdi:flash
    - type: tile
      entity: sensor.solarnet_power_photovoltaics
      name: Solar now
      icon: mdi:solar-power
      color: yellow
    - type: tile
      entity: sensor.electricity_advisor_power
      name: Grid now
      icon: mdi:transmission-tower
      color: blue
    - type: statistic
      entity: sensor.primo_5_0_1_energy_day
      name: Solar today
      icon: mdi:weather-sunny
      stat_type: change
      period:
        calendar:
          period: day
    - type: statistic
      entity: sensor.electricity_advisor_energy_today
      name: Grid today
      icon: mdi:lightning-bolt
      stat_type: change
      period:
        calendar:
          period: day
    - type: energy-date-selection
    - type: energy-usage-graph
  - type: grid
    cards:
    - type: heading
      heading: Zones
      icon: mdi:thermostat
    - type: conditional
      conditions:
      - condition: state
        entity: climate.ac
        state_not: 'off'
      card:
        type: tile
        entity: climate.ac_lounge
        name: Living Room
        icon: mdi:sofa
        features_position: bottom
        features:
        - type: climate-hvac-modes
          hvac_modes:
          - 'off'
          - heat_cool
        - type: target-temperature
    - type: conditional
      conditions:
      - condition: state
        entity: climate.ac
        state: 'off'
      card:
        type: tile
        entity: climate.ac_lounge
        name: Living Room
