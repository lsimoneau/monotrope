---
# Apply host-side LXC config (/etc/pve/lxc/<vmid>.conf) for each LXC in
# inventory whose `proxmox_host` matches this Proxmox host.
#
# Each LXC declares an `lxc_features` list. Supported features are defined
# in vars/main.yml (proxmox_lxc_feature_specs):
#
#   - tun:        passthrough /dev/net/tun (Tailscale, WireGuard).
#   - igpu:       passthrough /dev/dri so the LXC can use the host's iGPU
#                 (Jellyfin VAAPI/QSV transcoding). Adds host video/render
#                 GIDs to the idmap so the bind-mounted device files keep
#                 their group ownership inside the container.
#   - nas_idmap:  identity-map UID/GID 1028 (the NAS `homelab` user) so an
#                 unprivileged LXC can read NFS shares owned by 1028:1028
#                 without world-permissions hacks.
#
# We render the entire `lxc.*` block as one templated region (see
# templates/lxc_conf.j2) rather than using blockinfile or per-line
# lineinfile. Two reasons:
#
#   (1) The idmap segments depend on the *union* of passthrough UIDs/GIDs
#       across all selected features — adding `igpu` to an LXC that already
#       has `nas_idmap` requires breaking the previously-contiguous idmap
#       into more segments, so individual feature blocks can't be appended
#       independently.
#   (2) Proxmox normalises this file when `pct set` runs (URL-encoding
#       arbitrary comments, stripping content between unrecognised markers),
#       which would mangle blockinfile markers. Raw `lxc.*` directive lines,
#       however, are preserved verbatim — so claiming ownership of the
#       entire `lxc.*` region is safe; non-`lxc.*` lines (Proxmox's own
#       keys: cores, memory, mp0, etc.) are passed through untouched.
#
# Changes only take effect after an LXC restart, so this role reboots only
# the LXCs whose host-side config actually changed.

- name: Build per-LXC list for this Proxmox host
  ansible.builtin.set_fact:
    proxmox_lxc_apply: >-
      {{
        groups['lxcs']
        | map('extract', hostvars)
        | selectattr('proxmox_host', 'defined')
        | selectattr('proxmox_host', 'equalto', inventory_hostname)
        | list
      }}

- name: Slurp current LXC conf
  ansible.builtin.slurp:
    src: "/etc/pve/lxc/{{ item.vmid }}.conf"
  loop: "{{ proxmox_lxc_apply }}"
  loop_control:
    label: "vmid={{ item.vmid }}"
  register: lxc_confs_raw

- name: Render and apply LXC conf
  ansible.builtin.copy:
    dest: "/etc/pve/lxc/{{ item.0.vmid }}.conf"
    content: "{{ lookup('template', 'lxc_conf.j2') }}"
  # /etc/pve is a FUSE pmxcfs mount with fixed root:www-data 0640 ownership;
  # don't set owner/group/mode here or chgrp/chown will fail.
  vars:
    current_content: "{{ item.1.content | b64decode }}"
    lxc_features: "{{ item.0.lxc_features | default([]) }}"
  loop: "{{ proxmox_lxc_apply | zip(lxc_confs_raw.results) | list }}"
  loop_control:
    label: "vmid={{ item.0.vmid }}"
  register: lxc_confs_apply

- name: Aggregate passthrough UIDs across all LXCs on this host
  ansible.builtin.set_fact:
    proxmox_passthrough_uids: >-
      {{
        (proxmox_passthrough_uids | default([]))
        + (proxmox_lxc_feature_specs[item.1].passthrough_uids | default([]) | map('int') | list)
      }}
  loop: "{{ proxmox_lxc_apply | subelements('lxc_features', {'skip_missing': True}) }}"
  loop_control:
    label: "vmid={{ item.0.vmid }} feature={{ item.1 }}"

- name: Aggregate passthrough GIDs across all LXCs on this host
  ansible.builtin.set_fact:
    proxmox_passthrough_gids: >-
      {{
        (proxmox_passthrough_gids | default([]))
        + (proxmox_lxc_feature_specs[item.1].passthrough_gids | default([]) | map('int') | list)
      }}
  loop: "{{ proxmox_lxc_apply | subelements('lxc_features', {'skip_missing': True}) }}"
  loop_control:
    label: "vmid={{ item.0.vmid }} feature={{ item.1 }}"

- name: Ensure LXC has no hardcoded nameserver (use DHCP-provided DNS)
  ansible.builtin.command:
    cmd: "pct set {{ item.vmid }} --delete nameserver"
  loop: "{{ proxmox_lxc_apply }}"
  loop_control:
    label: "vmid={{ item.vmid }}"
  vars:
    current_ns: >-
      {{
        (lxc_confs_raw.results
         | selectattr('item.vmid', 'equalto', item.vmid)
         | map(attribute='content') | first | b64decode).splitlines()
        | select('match', '^nameserver:')
        | map('regex_replace', '^nameserver:\\s*', '')
        | first | default('')
      }}
  when: current_ns != ''
  changed_when: true
  register: lxc_ns_cleared

- name: Ensure subuid entries for passthrough UIDs
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "root:{{ item }}:1"
    state: present
  loop: "{{ proxmox_passthrough_uids | default([]) | unique | sort }}"

- name: Ensure subgid entries for passthrough GIDs
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:{{ item }}:1"
    state: present
  loop: "{{ proxmox_passthrough_gids | default([]) | unique | sort }}"

- name: Restart LXCs whose host-side config changed
  ansible.builtin.command: "pct reboot {{ item }}"
  loop: >-
    {{
      ((lxc_confs_apply.results
        | selectattr('changed', 'equalto', true)
        | map(attribute='item.0.vmid') | list)
       + (lxc_ns_cleared.results | default([])
          | selectattr('changed', 'equalto', true)
          | map(attribute='item.vmid') | list))
      | unique
    }}
  changed_when: true
