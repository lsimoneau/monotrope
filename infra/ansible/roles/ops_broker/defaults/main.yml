---
# ops-broker: the lifecycle/observability capability surface for a host.
# Runs as an unprivileged system user whose only powers come from group
# membership — no root, no sudo.

ops_broker_user: opsbroker
ops_broker_dir: /opt/ops-broker

# Bind to this host's LAN IP only (never 0.0.0.0). Hermes reaches it over the LAN.
ops_broker_bind: "{{ ansible_host }}"
ops_broker_port: 9988

# Broker identity for audit trail. Override per-host (e.g. "pve-ops").
ops_broker_name: "apps-ops"

# Systemd unit ordering. Override for hosts without Docker.
ops_broker_after: "network-online.target docker.service"

# Groups granted to the broker user. Override for hosts without Docker.
ops_broker_groups:
  - docker
  - systemd-journal

# Limits surfaced into the rendered config and enforced by the server.
ops_broker_max_lines: 1000
ops_broker_max_file_bytes: 262144   # 256 KiB cap on read_file output (tail)
ops_broker_restart_cooldown: 60     # min seconds between restarts of one service
ops_broker_restart_per_hour: 6      # cap per service per rolling hour

# Shared uv-managed Python install, accessible to the service user.
# uv installs to this directory instead of /root/.local.
ops_broker_python_version: "3.14"
ops_broker_python_dir: /opt/uv-python

# Shared scaffold source, relative to the playbook dir (infra/ansible →
# ../broker_core = infra/broker_core). Copied to the host and installed into the venv.
broker_core_src: "{{ playbook_dir }}/../broker_core"

# Per-host service allowlist. Define in inventory/host_vars. Empty default means
# an unconfigured host runs a broker that manages nothing (safe), never errors.
ops_broker_services: {}

# Per-host diagnostic-file allowlist for read_file. Each key maps to either
# {container, path} (read from inside a container volume via docker exec) or
# {path} (a host-readable file). Empty default = read_file exposes nothing.
ops_broker_files: {}
