---
# Bring up the audible-ingest sidecar — a small Python+ffmpeg+audible-cli
# container that periodically downloads new Audible purchases, decrypts
# the .aaxc with the per-book voucher, and lays them out under
# /audiobooks/<Author>/<Title>/<Title>.m4b for audiobookshelf to scan.
#
# Image is built locally on the apps LXC (no external registry). Container
# runs long-lived (`tail -f /dev/null`) so a host-side systemd timer can
# `docker exec` the ingestion script without per-run startup overhead, and
# so first-time `audible quickstart` can be run interactively in the same
# container.
#
# Container runs as {{ audible_ingest_puid }}:{{ audible_ingest_pgid }}
# (the NAS `homelab` user) so writes into /audiobooks land with the right
# ownership over NFS.

- name: Ensure audible-ingest directory
  ansible.builtin.file:
    path: "{{ audible_ingest_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Ensure build context directory
  ansible.builtin.file:
    path: "{{ audible_ingest_dir }}/build"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Sync Dockerfile to build context
  ansible.builtin.copy:
    src: Dockerfile
    dest: "{{ audible_ingest_dir }}/build/Dockerfile"
    owner: root
    group: root
    mode: '0644'
  register: audible_ingest_dockerfile

- name: Sync audible-ingest script to build context
  ansible.builtin.copy:
    src: audible-ingest
    dest: "{{ audible_ingest_dir }}/build/audible-ingest"
    owner: root
    group: root
    mode: '0755'
  register: audible_ingest_script

- name: Build audible-ingest image
  ansible.builtin.command:
    cmd: docker build -t {{ audible_ingest_image }} .
    chdir: "{{ audible_ingest_dir }}/build"
  when: audible_ingest_dockerfile.changed or audible_ingest_script.changed
  register: audible_ingest_build
  changed_when: true

- name: Render compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ audible_ingest_dir }}/compose.yml"
    owner: root
    group: root
    mode: '0644'
  register: audible_ingest_compose

- name: Chown audible-ingest volumes to runtime UID/GID
  # Run unconditionally: ownership drifts whenever someone uses `docker cp`
  # to seed auth files (which always lands as root), and chown is cheap.
  # Idempotent — only re-chowns files that aren't already at target UID.
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      -v audible-ingest_audible_config:/var/lib/audible-cli
      -v audible-ingest_audible_state:/var/lib/audible-ingest
      alpine:latest
      chown -R {{ audible_ingest_puid }}:{{ audible_ingest_pgid }}
      /var/lib/audible-cli /var/lib/audible-ingest
  changed_when: false

- name: Bring up audible-ingest
  ansible.builtin.command:
    cmd: docker compose up -d --remove-orphans
    chdir: "{{ audible_ingest_dir }}"
  register: audible_ingest_up
  changed_when: >-
    'Started' in audible_ingest_up.stderr
    or 'Created' in audible_ingest_up.stderr
    or 'Recreate' in audible_ingest_up.stderr

- name: Restart audible-ingest if compose or image changed
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate
    chdir: "{{ audible_ingest_dir }}"
  when: audible_ingest_compose.changed or audible_ingest_build.changed
  changed_when: true

- name: Install audible-ingest systemd service
  ansible.builtin.template:
    src: audible-ingest.service.j2
    dest: /etc/systemd/system/audible-ingest.service
    owner: root
    group: root
    mode: '0644'
  register: audible_ingest_service_unit

- name: Install audible-ingest systemd timer
  ansible.builtin.template:
    src: audible-ingest.timer.j2
    dest: /etc/systemd/system/audible-ingest.timer
    owner: root
    group: root
    mode: '0644'
  register: audible_ingest_timer_unit

- name: Enable audible-ingest timer
  ansible.builtin.systemd:
    name: audible-ingest.timer
    enabled: true
    state: started
    daemon_reload: true
