---
# Install Tailscale and authenticate to the tailnet.
#
# Required vars:
#   tailscale_auth_key — reusable key from
#     https://login.tailscale.com/admin/settings/keys
#     resolved via group_vars/all/vars.yml → vault_tailscale_auth_key in vault.yml

- name: Install dependencies for Tailscale apt repo
  apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Tailscale apt keyring
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'

- name: Add Tailscale apt repo
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/debian/{{ ansible_distribution_release }}.tailscale-keyring.list"
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: '0644'

- name: Install Tailscale
  apt:
    name: tailscale
    state: present
    update_cache: true

- name: Enable and start tailscaled
  systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check Tailscale auth status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Authenticate Tailscale
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ tailscale_auth_key }}
    --hostname={{ inventory_hostname }}
    --ssh
  when: >-
    tailscale_status.rc != 0
    or (tailscale_status.stdout | from_json).BackendState != 'Running'
  no_log: true
