---
# Install Jellyfin natively from the official Debian repo and enable
# the systemd service. Configuration (libraries, users) is done via the
# Jellyfin web UI on first run.

- name: Install dependencies for Jellyfin apt repo
  apt:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Jellyfin apt keyring
  ansible.builtin.shell: |
    curl -fsSL https://repo.jellyfin.org/jellyfin_team.gpg.key \
      | gpg --dearmor -o /usr/share/keyrings/jellyfin-archive-keyring.gpg
  args:
    creates: /usr/share/keyrings/jellyfin-archive-keyring.gpg

- name: Add Jellyfin apt repo
  copy:
    dest: /etc/apt/sources.list.d/jellyfin.list
    content: "deb [signed-by=/usr/share/keyrings/jellyfin-archive-keyring.gpg] https://repo.jellyfin.org/debian {{ ansible_distribution_release }} main\n"
    mode: '0644'

- name: Install Jellyfin
  apt:
    name: jellyfin
    state: present
    update_cache: true

# Align the jellyfin user's UID/GID with the NAS-reading identity so the LXC's
# nas_idmap (1028 → 1028) lets it read /media directly. Idempotent — only acts
# when current values differ.
- name: Get current jellyfin UID
  ansible.builtin.command: id -u jellyfin
  register: jellyfin_current_uid
  changed_when: false

- name: Get current jellyfin GID
  ansible.builtin.command: id -g jellyfin
  register: jellyfin_current_gid
  changed_when: false

- name: Align jellyfin UID/GID with {{ jellyfin_service_uid }}
  when: >-
    jellyfin_current_uid.stdout | int != jellyfin_service_uid
    or jellyfin_current_gid.stdout | int != jellyfin_service_uid
  block:
    - name: Stop jellyfin to release files before UID change
      ansible.builtin.systemd:
        name: jellyfin
        state: stopped

    - name: Set jellyfin group GID
      ansible.builtin.command: "groupmod -g {{ jellyfin_service_uid }} jellyfin"
      when: jellyfin_current_gid.stdout | int != jellyfin_service_uid

    - name: Set jellyfin user UID
      ansible.builtin.command: "usermod -u {{ jellyfin_service_uid }} jellyfin"
      when: jellyfin_current_uid.stdout | int != jellyfin_service_uid

    - name: Reown jellyfin runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        owner: jellyfin
        group: jellyfin
        recurse: true
      loop:
        - /var/lib/jellyfin
        - /var/cache/jellyfin
        - /var/log/jellyfin
        - /etc/jellyfin

- name: Enable and start Jellyfin service
  systemd:
    name: jellyfin
    enabled: true
    state: started

# iGPU passthrough: align the container's render group GID with the host's
# so the bind-mounted /dev/dri/renderD128 (passed through via the
# proxmox_lxc_config `igpu` idmap) keeps its group ownership inside the
# container, and add jellyfin to render+video. The video group is GID 44 on
# both Debian default and the host, so usually a no-op.
- name: Align render group GID with host
  when: jellyfin_igpu
  block:
    - name: Get current render group GID
      ansible.builtin.command: getent group render
      register: render_group
      changed_when: false
      failed_when: render_group.rc not in [0, 2]

    - name: Ensure render group exists with host-matching GID
      when: render_group.rc != 0 or (render_group.stdout.split(':')[2] | int) != lxc_igpu_render_gid
      block:
        - name: Stop jellyfin to release group memberships before GID change
          ansible.builtin.systemd:
            name: jellyfin
            state: stopped

        - name: Set render group GID
          ansible.builtin.group:
            name: render
            gid: "{{ lxc_igpu_render_gid }}"
            state: present

    - name: Ensure jellyfin is a member of video and render
      ansible.builtin.user:
        name: jellyfin
        groups:
          - video
          - render
        append: true

    - name: Ensure jellyfin is running after iGPU group adjustments
      ansible.builtin.systemd:
        name: jellyfin
        state: started
