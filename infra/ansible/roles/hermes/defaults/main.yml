---
# Native (non-Docker) Hermes Agent install in an LXC.

# Pin to the same version that ran in Docker on the VPS at migration time.
# Bump independently of the docker image once the LXC is the source of truth.
hermes_version: v2026.4.13
hermes_repo_url: https://github.com/NousResearch/hermes-agent.git

# Filesystem layout. /opt/data matches the docker container path so a state
# rsync from the VPS volume drops in unchanged.
hermes_install_dir: /usr/local/lib/hermes-agent
hermes_home: /opt/data

# UID/GID of the in-LXC service user. Matches the upstream Docker image's
# `hermes` user (UID 10000) so file ownership in /opt/data survives the
# rsync from the VPS docker volume without a chown pass.
hermes_user: hermes
hermes_uid: 10000
hermes_gid: 10000

# Public URL for the Miniflux instance still hosted on the VPS — the plugin
# can no longer reach it on the docker-internal network from the LXC.
hermes_miniflux_url: https://reader.monotrope.au
