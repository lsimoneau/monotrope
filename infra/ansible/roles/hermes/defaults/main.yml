---
# Native (non-Docker) Hermes Agent install in an LXC. Path layout matches
# the upstream FHS-root install (see scripts/install.sh in hermes-agent).
# The LXC itself is the sandbox — Hermes runs as root inside.

# Bump independently of the docker image now that the LXC is the source of
# truth. v2026.4.13 was the docker tag at migration. Ansible is the single
# authoritative updater for the install: do NOT also run `hermes update` on
# the host — the two checkouts fight over HEAD and each restart the gateway,
# which can leave the running process holding stale code (an in-process module
# cache that no longer matches disk). To update Hermes, bump this tag + deploy.
hermes_version: v2026.5.16
hermes_repo_url: https://github.com/NousResearch/hermes-agent.git

# Filesystem layout. Matches upstream FHS-root install.sh defaults.
hermes_install_dir: /usr/local/lib/hermes-agent
hermes_home: /root/.hermes

# Public URL for the Miniflux instance still hosted on the VPS — the plugin
# can no longer reach it on the docker-internal network from the LXC.
hermes_miniflux_url: https://reader.monotrope.au

# Web dashboard (hermes dashboard). Listens on all interfaces so Caddy on the
# Proxmox host can reverse-proxy. The --insecure flag is set in the unit.
hermes_dashboard_host: "0.0.0.0"
hermes_dashboard_port: 9119
