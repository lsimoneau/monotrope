---
# Native (non-Docker) Hermes Agent install. The LXC itself is the sandbox —
# Hermes runs as root under systemd, gets to apt install / write anywhere
# within the container's filesystem, and is firewalled at the Proxmox level
# rather than at a docker-network boundary.
#
# Path layout matches the upstream FHS-root install (scripts/install.sh in
# hermes-agent). State (auth tokens, sessions, memories, state.db, evolved
# skills) lives in {{ hermes_home }} (default /root/.hermes/).

- name: Install runtime dependencies
  ansible.builtin.apt:
    name:
      - build-essential   # for any C extensions in the venv
      - ca-certificates
      - curl
      - ffmpeg            # TTS / audio handling
      - git
      - python3
      - python3-venv
      - ripgrep           # skill search
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install uv
  ansible.builtin.shell: |
    set -euo pipefail
    curl -LsSf https://astral.sh/uv/install.sh \
      | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
  args:
    creates: /usr/local/bin/uv
    executable: /bin/bash

- name: Ensure HERMES_HOME exists
  ansible.builtin.file:
    path: "{{ hermes_home }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Clone hermes-agent at pinned ref
  ansible.builtin.git:
    repo: "{{ hermes_repo_url }}"
    dest: "{{ hermes_install_dir }}"
    version: "{{ hermes_version }}"
    force: true
  notify: Restart hermes-gateway
  register: hermes_repo

- name: Create venv via uv
  ansible.builtin.command: uv venv --python 3.11 .venv
  args:
    chdir: "{{ hermes_install_dir }}"
    creates: "{{ hermes_install_dir }}/.venv/bin/python"

- name: Install hermes-agent into venv (editable, all extras)
  ansible.builtin.command: uv pip install -e ".[all]"
  args:
    chdir: "{{ hermes_install_dir }}"
  environment:
    VIRTUAL_ENV: "{{ hermes_install_dir }}/.venv"
  when: hermes_repo.changed
  notify: Restart hermes-gateway

- name: Symlink hermes binary to /usr/local/bin
  ansible.builtin.file:
    src: "{{ hermes_install_dir }}/.venv/bin/hermes"
    dest: /usr/local/bin/hermes
    state: link
    force: true

- name: Configure hermes static settings via hermes config set
  ansible.builtin.shell: |
    set -euo pipefail

    hermes config set memory.memory_enabled true
    hermes config set memory.user_profile_enabled true

    hermes config set agent.max_turns 70

    hermes config set TELEGRAM_HOME_CHANNEL 8455090116
    hermes config set EMAIL_HOME_CHANNEL louis@monotrope.au

    # MCP server for apps_ops broker — tools.allowlist omitted so the full
    # broker toolset is discovered on connect and future tools are picked up on
    # /reload-mcp without a config change.
    hermes config set mcp_servers.apps_ops.url "http://{{ hostvars['apps'].ansible_host }}:9988/mcp"
    hermes config set mcp_servers.apps_ops.headers.Authorization "Bearer {{ ops_broker_token }}"
    hermes config set mcp_servers.apps_ops.tools.prompts false
    hermes config set mcp_servers.apps_ops.tools.resources false
  args:
    executable: /bin/bash  # set -o pipefail is a bashism; default /bin/sh is dash
  no_log: true
  notify: Restart hermes-gateway

- name: Stage plugins directory
  ansible.builtin.copy:
    src: plugins/
    dest: "{{ hermes_home }}/plugins/"
    owner: root
    group: root
    mode: '0600'
    directory_mode: '0700'
  notify: Restart hermes-gateway

- name: Write Miniflux plugin config
  ansible.builtin.copy:
    dest: "{{ hermes_home }}/plugins/miniflux/config.json"
    owner: root
    group: root
    mode: '0600'
    content: |
      {
        "base_url": "{{ hermes_miniflux_url }}",
        "api_key": "{{ hermes_miniflux_api_key }}"
      }
  no_log: true
  notify: Restart hermes-gateway

# Authored skills ("seeds") live in the repo. Hermes owns its evolved copies
# in {{ hermes_home }}/skills; we copy seeds in no-clobber so deploys never
# overwrite agent-modified skills. For fresh installs this plants the seeds
# before first boot; for existing installs it only adds new seed files.
- name: Stage seed skills
  ansible.builtin.copy:
    src: seeds/
    dest: /usr/local/share/hermes-seeds/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'

- name: Ensure skills directory exists
  ansible.builtin.file:
    path: "{{ hermes_home }}/skills"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Plant seed skills (no-clobber)
  ansible.builtin.command: cp -rn /usr/local/share/hermes-seeds/. {{ hermes_home }}/skills/
  changed_when: false

- name: Write gateway environment file
  ansible.builtin.template:
    src: hermes-gateway.env.j2
    dest: /etc/default/hermes-gateway
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart hermes-gateway

- name: Install hermes-gateway systemd unit
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: /etc/systemd/system/hermes-gateway.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart hermes-gateway

- name: Enable hermes-gateway
  ansible.builtin.systemd:
    name: hermes-gateway
    enabled: true
    daemon_reload: true

# ── Nightly state snapshot ─────────────────────────────────────────────────
# `hermes backup --quick` snapshots config + state.db + auth + cron into
# {{ hermes_home }}/state-snapshots/<timestamp>-<label>/. State.db carries
# memories and sessions, so this is the only thing that captures hermes'
# evolving knowledge coherently. Retain last 14 nightlies; other labels
# (pre-deploy, manual) are left alone.

- name: Install hermes-backup script
  ansible.builtin.template:
    src: hermes-backup.sh.j2
    dest: /usr/local/bin/hermes-backup
    owner: root
    group: root
    mode: '0755'

- name: Install hermes-backup systemd unit
  ansible.builtin.template:
    src: hermes-backup.service.j2
    dest: /etc/systemd/system/hermes-backup.service
    owner: root
    group: root
    mode: '0644'

- name: Install hermes-backup systemd timer
  ansible.builtin.template:
    src: hermes-backup.timer.j2
    dest: /etc/systemd/system/hermes-backup.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable hermes-backup timer
  ansible.builtin.systemd:
    name: hermes-backup.timer
    enabled: true
    state: started
    daemon_reload: true
