---
# Native (non-Docker) Hermes Agent install. The LXC itself is the sandbox —
# Hermes runs as root under systemd, gets to apt install / write anywhere
# within the container's filesystem, and is firewalled at the Proxmox level
# rather than at a docker-network boundary.
#
# Path layout matches the upstream FHS-root install (scripts/install.sh in
# hermes-agent). State (auth tokens, sessions, memories, state.db, evolved
# skills) lives in {{ hermes_home }} (default /root/.hermes/).

- name: Install runtime dependencies
  ansible.builtin.apt:
    name:
      - build-essential   # for any C extensions in the venv
      - ca-certificates
      - curl
      - ffmpeg            # TTS / audio handling
      - git
      - python3
      - python3-venv
      - python3-yaml
      - ripgrep           # skill search
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add GitHub CLI apt repository
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      > /etc/apt/sources.list.d/github-cli.list
  args:
    creates: /etc/apt/sources.list.d/github-cli.list
    executable: /bin/bash

- name: Install gh CLI
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true

- name: Install uv
  ansible.builtin.shell: |
    set -euo pipefail
    curl -LsSf https://astral.sh/uv/install.sh \
      | env UV_INSTALL_DIR=/usr/local/bin UV_NO_MODIFY_PATH=1 sh
  args:
    creates: /usr/local/bin/uv
    executable: /bin/bash

- name: Ensure HERMES_HOME exists
  ansible.builtin.file:
    path: "{{ hermes_home }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Clone hermes-agent at pinned ref
  ansible.builtin.git:
    repo: "{{ hermes_repo_url }}"
    dest: "{{ hermes_install_dir }}"
    version: "{{ hermes_version }}"
    force: true
  notify: Restart hermes-gateway
  register: hermes_repo

- name: Create venv via uv
  ansible.builtin.command: uv venv --python 3.11 .venv
  args:
    chdir: "{{ hermes_install_dir }}"
    creates: "{{ hermes_install_dir }}/.venv/bin/python"

- name: Install hermes-agent into venv (editable, all extras)
  ansible.builtin.command: uv pip install -e ".[all]"
  args:
    chdir: "{{ hermes_install_dir }}"
  environment:
    VIRTUAL_ENV: "{{ hermes_install_dir }}/.venv"
  when: hermes_repo.changed
  notify: Restart hermes-gateway

- name: Symlink hermes binary to /usr/local/bin
  ansible.builtin.file:
    src: "{{ hermes_install_dir }}/.venv/bin/hermes"
    dest: /usr/local/bin/hermes
    state: link
    force: true

- name: Write secrets to hermes .env
  ansible.builtin.shell: |
    set -euo pipefail
    export HERMES_HOME={{ hermes_home }}
    hermes config set OPENROUTER_API_KEY "{{ openrouter_api_key }}"
    hermes config set TELEGRAM_BOT_TOKEN "{{ hermes_telegram_bot_token }}"
    hermes config set TELEGRAM_ALLOWED_USERS "{{ hermes_telegram_allowed_users }}"
    hermes config set EMAIL_ADDRESS "monotrope.agent@gmail.com"
    hermes config set EMAIL_PASSWORD "{{ hermes_email_password }}"
    hermes config set EMAIL_IMAP_HOST "imap.gmail.com"
    hermes config set EMAIL_SMTP_HOST "smtp.gmail.com"
    hermes config set EMAIL_ALLOWED_USERS "{{ hermes_email_allowed_users }}"
    hermes config set BROWSERBASE_API_KEY "{{ hermes_browserbase_api_key }}"
    hermes config set BROWSERBASE_PROJECT_ID "{{ hermes_browserbase_project_id }}"
    hermes config set GITHUB_TOKEN "{{ hermes_github_token }}"
    hermes config set GH_TOKEN "{{ hermes_github_token }}"
  args:
    executable: /bin/bash
  no_log: true
  notify: Restart hermes-gateway

- name: Configure hermes static settings via hermes config set
  ansible.builtin.shell: |
    set -euo pipefail

    hermes config set memory.memory_enabled true
    hermes config set memory.user_profile_enabled true

    hermes config set agent.max_turns 70

    hermes config set TELEGRAM_HOME_CHANNEL 8455090116
    hermes config set EMAIL_HOME_CHANNEL louis@monotrope.au

    # MCP server for apps_ops broker — tools.allowlist omitted so the full
    # broker toolset is discovered on connect and future tools are picked up on
    # /reload-mcp without a config change.
    hermes config set mcp_servers.apps_ops.url "http://{{ hostvars['apps'].ansible_host }}:9988/mcp"
    hermes config set mcp_servers.apps_ops.headers.Authorization "Bearer {{ ops_broker_token }}"
    hermes config set mcp_servers.apps_ops.tools.prompts false
    hermes config set mcp_servers.apps_ops.tools.resources false

    hermes config set mcp_servers.pve_ops.url "http://{{ hostvars['pve'].ansible_host }}:9988/mcp"
    hermes config set mcp_servers.pve_ops.headers.Authorization "Bearer {{ ops_broker_token }}"
    hermes config set mcp_servers.pve_ops.tools.prompts false
    hermes config set mcp_servers.pve_ops.tools.resources false

  args:
    executable: /bin/bash  # set -o pipefail is a bashism; default /bin/sh is dash
  no_log: true
  notify: Restart hermes-gateway

- name: Set terminal.env_passthrough as a YAML list
  ansible.builtin.shell: |
    set -euo pipefail
    python3 -c "
    import yaml
    p = '{{ hermes_home }}/config.yaml'
    with open(p) as f:
        c = yaml.safe_load(f)
    c.setdefault('terminal', {})['env_passthrough'] = ['GITHUB_TOKEN', 'GH_TOKEN']
    with open(p, 'w') as f:
        yaml.dump(c, f, default_flow_style=False)
    "
  args:
    executable: /bin/bash
  no_log: true
  notify: Restart hermes-gateway

- name: Stage plugins directory
  ansible.builtin.copy:
    src: plugins/
    dest: "{{ hermes_home }}/plugins/"
    owner: root
    group: root
    mode: '0600'
    directory_mode: '0700'
  notify: Restart hermes-gateway

- name: Write Miniflux plugin config
  ansible.builtin.copy:
    dest: "{{ hermes_home }}/plugins/miniflux/config.json"
    owner: root
    group: root
    mode: '0600'
    content: |
      {
        "base_url": "{{ hermes_miniflux_url }}",
        "api_key": "{{ hermes_miniflux_api_key }}"
      }
  no_log: true
  notify: Restart hermes-gateway

# Authored skills ("seeds") live in the repo. Hermes owns its evolved copies
# in {{ hermes_home }}/skills; we copy seeds in no-clobber so deploys never
# overwrite agent-modified skills. For fresh installs this plants the seeds
# before first boot; for existing installs it only adds new seed files.
- name: Stage seed skills
  ansible.builtin.copy:
    src: seeds/
    dest: /usr/local/share/hermes-seeds/
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'

- name: Ensure skills directory exists
  ansible.builtin.file:
    path: "{{ hermes_home }}/skills"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Plant seed skills (no-clobber)
  ansible.builtin.command: cp -rn /usr/local/share/hermes-seeds/. {{ hermes_home }}/skills/
  changed_when: false

- name: Write gateway environment file
  ansible.builtin.template:
    src: hermes-gateway.env.j2
    dest: /etc/default/hermes-gateway
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: Restart hermes-gateway

- name: Install hermes-gateway systemd unit
  ansible.builtin.template:
    src: hermes-gateway.service.j2
    dest: /etc/systemd/system/hermes-gateway.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart hermes-gateway

- name: Enable hermes-gateway
  ansible.builtin.systemd:
    name: hermes-gateway
    enabled: true
    daemon_reload: true

# ── Web dashboard ──────────────────────────────────────────────────────────
# The built-in `hermes dashboard` serves a React management UI (status, config,
# sessions, cron, skills, logs) on port 9119. It needs a pre-built frontend
# (Node.js build step) — we install Node.js for the build only, then the
# systemd unit runs the dashboard with --skip-build against the baked dist.

- name: Install Node.js (for web UI build)
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node
    executable: /bin/bash

- name: Build web UI frontend
  ansible.builtin.shell: |
    set -euo pipefail
    cd {{ hermes_install_dir }}/web
    npm install --ignore-scripts
    npm run build
  args:
    executable: /bin/bash
    chdir: "{{ hermes_install_dir }}/web"
  when: hermes_repo.changed
  notify: Restart hermes-dashboard

- name: Install hermes-dashboard systemd unit
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: /etc/systemd/system/hermes-dashboard.service
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload systemd
    - Restart hermes-dashboard

- name: Enable hermes-dashboard
  ansible.builtin.systemd:
    name: hermes-dashboard
    enabled: true
    daemon_reload: true

# ── Nightly state snapshot ─────────────────────────────────────────────────
# `hermes backup --quick` snapshots config + state.db + auth + cron into
# {{ hermes_home }}/state-snapshots/<timestamp>-<label>/. State.db carries
# memories and sessions, so this is the only thing that captures hermes'
# evolving knowledge coherently. Retain last 14 nightlies; other labels
# (pre-deploy, manual) are left alone.

- name: Install hermes-backup script
  ansible.builtin.template:
    src: hermes-backup.sh.j2
    dest: /usr/local/bin/hermes-backup
    owner: root
    group: root
    mode: '0755'

- name: Install hermes-backup systemd unit
  ansible.builtin.template:
    src: hermes-backup.service.j2
    dest: /etc/systemd/system/hermes-backup.service
    owner: root
    group: root
    mode: '0644'

- name: Install hermes-backup systemd timer
  ansible.builtin.template:
    src: hermes-backup.timer.j2
    dest: /etc/systemd/system/hermes-backup.timer
    owner: root
    group: root
    mode: '0644'

- name: Enable hermes-backup timer
  ansible.builtin.systemd:
    name: hermes-backup.timer
    enabled: true
    state: started
    daemon_reload: true
