---
# Install Docker CE + Compose plugin from Docker's official Debian repo,
# log to journald, and run a weekly prune timer.

- name: Install dependencies for Docker apt repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Add Docker apt keyring
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://download.docker.com/linux/debian/gpg \
      | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg
    executable: /bin/bash

- name: Add Docker apt repo
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: '0644'
    content: |
      deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable

- name: Install Docker engine + Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Configure Docker daemon to log to journald
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "log-driver": "journald"
      }
  register: docker_daemon_config

- name: Restart Docker if daemon.json changed
  ansible.builtin.systemd:
    name: docker
    state: restarted
  when: docker_daemon_config.changed

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Install docker-prune systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-prune.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Prune unused Docker images and build cache
      Requires=docker.service
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/docker image prune -af --filter until=48h
      ExecStart=/usr/bin/docker builder prune -af --filter until=48h

- name: Install docker-prune systemd timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-prune.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Weekly Docker image prune

      [Timer]
      OnCalendar=weekly
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable and start docker-prune timer
  ansible.builtin.systemd:
    name: docker-prune.timer
    enabled: true
    state: started
    daemon_reload: true
