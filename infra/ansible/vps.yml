---
- name: Provision monotrope.au server
  hosts: vps
  become: true

  vars:
    # Static, deploy-machine-local config. Service-level vars and secrets
    # come from group_vars/all/{vars,vault}.yml.
    site_dir: /var/www/monotrope
    deploy_user: deploy
    deploy_pubkey: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
    goatcounter_version: "2.7.0"

  tasks:

    - name: Apply base role
      import_role:
        name: base

    # ── Caddy ───────────────────────────────────────────────────────────────

    - name: Add Caddy GPG key
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
          | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      args:
        creates: /usr/share/keyrings/caddy-stable-archive-keyring.gpg

    - name: Add Caddy apt repository
      shell: |
        curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
          | tee /etc/apt/sources.list.d/caddy-stable.list
      args:
        creates: /etc/apt/sources.list.d/caddy-stable.list

    - name: Install Caddy
      apt:
        name: caddy
        state: present
        update_cache: true

    - name: Install Caddyfile
      copy:
        src: ../Caddyfile
        dest: /etc/caddy/Caddyfile
        owner: root
        group: caddy
        mode: '0640'
      notify: Restart Caddy
      tags:
        - miniflux
        - goatcounter
        - calibre
        - koinsight
        - wallabag

    - name: Enable and start Caddy
      systemd:
        name: caddy
        enabled: true
        state: started

    # ── Site directory ───────────────────────────────────────────────────────

    - name: Create www system user
      user:
        name: www
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        state: present

    # ── SSH hardening ───────────────────────────────────────────────────────

    - name: Harden SSH configuration
      copy:
        dest: /etc/ssh/sshd_config.d/hardening.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          PasswordAuthentication no
          PermitRootLogin prohibit-password
          MaxAuthTries 3
      notify: Restart sshd

    # ── Fail2ban ────────────────────────────────────────────────────────────

    - name: Install fail2ban
      apt:
        name: fail2ban
        state: present

    - name: Configure fail2ban SSH jail
      copy:
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'
        content: |
          [sshd]
          enabled = true
          port = ssh
          maxretry = 3
          bantime = 3600
          findtime = 600
      notify: Restart fail2ban

    - name: Enable and start fail2ban
      systemd:
        name: fail2ban
        enabled: true
        state: started

    # ── UFW ─────────────────────────────────────────────────────────────────

    - name: Set UFW default incoming policy to deny
      ufw:
        default: deny
        direction: incoming

    - name: Set UFW default outgoing policy to allow
      ufw:
        default: allow
        direction: outgoing

    - name: Allow SSH
      ufw:
        rule: allow
        name: OpenSSH

    - name: Allow HTTP
      ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled

    # ── WireGuard ───────────────────────────────────────────────────────────

    - name: Install WireGuard
      apt:
        name: wireguard
        state: present
      tags: wireguard

    - name: Generate WireGuard server private key
      shell: wg genkey > /etc/wireguard/server_privatekey && chmod 600 /etc/wireguard/server_privatekey
      args:
        creates: /etc/wireguard/server_privatekey
      tags: wireguard

    - name: Generate WireGuard server public key
      shell: cat /etc/wireguard/server_privatekey | wg pubkey > /etc/wireguard/server_publickey
      args:
        creates: /etc/wireguard/server_publickey
      tags: wireguard

    - name: Read server private key
      slurp:
        src: /etc/wireguard/server_privatekey
      register: wg_server_privkey
      tags: wireguard

    - name: Read server public key
      slurp:
        src: /etc/wireguard/server_publickey
      register: wg_server_pubkey
      tags: wireguard

    - name: Write WireGuard config
      copy:
        dest: /etc/wireguard/wg0.conf
        owner: root
        group: root
        mode: '0600'
        content: |
          [Interface]
          PrivateKey = {{ wg_server_privkey.content | b64decode | trim }}
          Address = 10.100.0.1/24
          ListenPort = 51820

          [Peer]
          PublicKey = {{ wg_client_pubkey }}
          AllowedIPs = 10.100.0.2/32
      notify: Restart WireGuard
      tags: wireguard

    - name: Allow WireGuard UDP port
      ufw:
        rule: allow
        port: '51820'
        proto: udp
      tags: wireguard

    - name: Enable and start WireGuard
      systemd:
        name: wg-quick@wg0
        enabled: true
        state: started
      tags: wireguard

    - name: Display server public key
      debug:
        msg: "WireGuard server public key: {{ wg_server_pubkey.content | b64decode | trim }}"
      tags: wireguard

    # ── Docker ──────────────────────────────────────────────────────────────

    - name: Create Docker keyring directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Docker GPG key
      shell: |
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Add Docker apt repository
      shell: |
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
          | tee /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Configure Docker to log to journald
      copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "log-driver": "journald"
          }
      register: docker_daemon_config

    - name: Restart Docker after daemon.json change
      systemd:
        name: docker
        state: restarted
      when: docker_daemon_config.changed

    - name: Enable Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Install docker-prune systemd service
      copy:
        dest: /etc/systemd/system/docker-prune.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prune unused Docker images and build cache
          Requires=docker.service
          After=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/docker image prune -af --filter until=48h
          ExecStart=/usr/bin/docker builder prune -af --filter until=48h

    - name: Install docker-prune systemd timer
      copy:
        dest: /etc/systemd/system/docker-prune.timer
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Weekly Docker image prune

          [Timer]
          OnCalendar=weekly
          Persistent=true

          [Install]
          WantedBy=timers.target

    - name: Enable and start docker-prune timer
      systemd:
        name: docker-prune.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Create shared Docker network
      command: docker network create monotrope
      register: docker_net
      changed_when: docker_net.rc == 0
      failed_when: docker_net.rc != 0 and 'already exists' not in docker_net.stderr
      tags:
        - miniflux

    # ── Miniflux ────────────────────────────────────────────────────────────

    - name: Create Miniflux directory
      file:
        path: /opt/miniflux
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: miniflux

    - name: Copy Miniflux docker-compose.yml
      copy:
        src: ../miniflux/docker-compose.yml
        dest: /opt/miniflux/docker-compose.yml
        owner: root
        group: root
        mode: '0640'
      tags: miniflux

    - name: Write Miniflux .env
      copy:
        dest: /opt/miniflux/.env
        owner: root
        group: root
        mode: '0600'
        content: |
          MINIFLUX_DB_PASSWORD={{ miniflux_db_password }}
          MINIFLUX_ADMIN_USER={{ miniflux_admin_user }}
          MINIFLUX_ADMIN_PASSWORD={{ miniflux_admin_password }}
      no_log: true
      tags: miniflux

    - name: Pull and start Miniflux
      command: docker compose up -d --pull always
      args:
        chdir: /opt/miniflux
      tags: miniflux

    # ── Obsidian Headless Sync ─────────────────────────────────────────────
    # Runs obsidian-headless (npm: obsidian-headless) as a long-lived
    # sync daemon against a docker volume. No Electron on the server;
    # template expansion happens next time the note is opened on desktop.
    # Bootstrap (one-time):
    #   1. Set OBSIDIAN_VAULT_NAME in the env the playbook runs with
    #      (matches the name from `ob sync-list-remote`).
    #   2. `make obsidian` to build and start the container.
    #   3. `make obsidian-login` to do the interactive Obsidian Sync
    #      login inside the container — credentials persist in the
    #      obsidian_config volume. Re-run after a session is revoked.

    - name: Create Obsidian directory
      file:
        path: /opt/obsidian
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: obsidian

    - name: Copy Obsidian Dockerfile
      copy:
        src: ../obsidian/Dockerfile
        dest: /opt/obsidian/Dockerfile
        owner: root
        group: root
        mode: '0640'
      tags: obsidian

    - name: Copy Obsidian entrypoint
      copy:
        src: ../obsidian/entrypoint.sh
        dest: /opt/obsidian/entrypoint.sh
        owner: root
        group: root
        mode: '0755'
      tags: obsidian

    - name: Copy Obsidian docker-compose.yml
      copy:
        src: ../obsidian/docker-compose.yml
        dest: /opt/obsidian/docker-compose.yml
        owner: root
        group: root
        mode: '0640'
      tags: obsidian

    - name: Write Obsidian .env
      copy:
        dest: /opt/obsidian/.env
        owner: root
        group: root
        mode: '0600'
        content: |
          OBSIDIAN_VAULT_NAME={{ obsidian_vault_name }}
      no_log: true
      tags: obsidian

    - name: Ensure obsidian_vault volume exists
      command: docker volume create obsidian_obsidian_vault
      register: obsidian_vault_volume
      changed_when: obsidian_vault_volume.rc == 0 and 'already exists' not in (obsidian_vault_volume.stderr | default(''))
      failed_when: obsidian_vault_volume.rc != 0 and 'already exists' not in (obsidian_vault_volume.stderr | default(''))
      tags: obsidian

    - name: Build and start Obsidian Sync
      command: docker compose up -d --build
      args:
        chdir: /opt/obsidian
      tags: obsidian

    # ── Calibre (calibre-web + kobodl + MCP server) ──────────────────────

    - name: Create Calibre directory
      file:
        path: /opt/calibre
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: calibre

    - name: Copy Calibre docker-compose.yml
      copy:
        src: ../calibre/docker-compose.yml
        dest: /opt/calibre/docker-compose.yml
        owner: root
        group: root
        mode: '0640'
      tags: calibre

    - name: Pull and start Calibre services
      command: docker compose up -d --pull always
      args:
        chdir: /opt/calibre
      tags: calibre

    - name: Check if Calibre library exists
      command: >
        docker compose exec -T calibre-web
        test -f /calibre-library/metadata.db
      args:
        chdir: /opt/calibre
      register: calibre_db_check
      changed_when: false
      failed_when: false
      tags: calibre

    - name: Initialise Calibre library
      command: >
        docker compose exec -T --user abc calibre-web
        calibredb add --empty --with-library /calibre-library/
      args:
        chdir: /opt/calibre
      when: calibre_db_check.rc != 0
      tags: calibre

    - name: Install calibre-sync script
      copy:
        dest: /opt/calibre/sync.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          set -euo pipefail
          cd /opt/calibre

          # Download all books from Kobo
          docker compose exec -T --user abc calibre-web \
            kobodl --config /home/config/kobodl.json book get --get-all --output-dir /downloads

          # Import any new EPUBs into Calibre library
          # Files are kept in /downloads so kobodl can skip them next run
          docker compose exec -T --user abc calibre-web sh -c '
            export CALIBRE_CONFIG_DIRECTORY=/config/calibre
            for f in /downloads/*.epub; do
              [ -f "$f" ] || continue
              calibredb add "$f" --with-library /calibre-library/ || true
            done
          '
      tags: calibre

    # ── KoInsight ──────────────────────────────────────────────────────────

    - name: Create KoInsight directory
      file:
        path: /opt/koinsight
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: koinsight

    - name: Copy KoInsight docker-compose.yml
      copy:
        src: ../koinsight/docker-compose.yml
        dest: /opt/koinsight/docker-compose.yml
        owner: root
        group: root
        mode: '0640'
      tags: koinsight

    - name: Pull and start KoInsight
      command: docker compose up -d --pull always
      args:
        chdir: /opt/koinsight
      tags: koinsight

    # ── Wallabag ───────────────────────────────────────────────────────────

    - name: Create Wallabag directory
      file:
        path: /opt/wallabag
        state: directory
        owner: root
        group: root
        mode: '0750'
      tags: wallabag

    - name: Copy Wallabag docker-compose.yml
      copy:
        src: ../wallabag/docker-compose.yml
        dest: /opt/wallabag/docker-compose.yml
        owner: root
        group: root
        mode: '0640'
      tags: wallabag

    - name: Write Wallabag .env
      copy:
        dest: /opt/wallabag/.env
        owner: root
        group: root
        mode: '0600'
        content: |
          WALLABAG_SECRET={{ wallabag_secret }}
      no_log: true
      tags: wallabag

    - name: Pull and start Wallabag
      command: docker compose up -d --pull always
      args:
        chdir: /opt/wallabag
      tags: wallabag

    # ── GoatCounter ─────────────────────────────────────────────────────────

    - name: Create goatcounter system user
      user:
        name: goatcounter
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        state: present
      tags: goatcounter

    - name: Create GoatCounter data directory
      file:
        path: /var/lib/goatcounter
        state: directory
        owner: goatcounter
        group: goatcounter
        mode: '0750'
      tags: goatcounter

    - name: Download GoatCounter binary
      get_url:
        url: "https://github.com/arp242/goatcounter/releases/download/v{{ goatcounter_version }}/goatcounter-v{{ goatcounter_version }}-linux-amd64.gz"
        dest: /tmp/goatcounter.gz
        mode: '0644'
        checksum: "sha256:98d221cb9c8ef2bf76d8daa9cca647839f8d8b0bb5bc7400ff9337c5da834511"
      tags: goatcounter

    - name: Decompress GoatCounter binary
      shell: gunzip -f /tmp/goatcounter.gz && mv /tmp/goatcounter /usr/local/bin/goatcounter && chmod 0755 /usr/local/bin/goatcounter
      args:
        creates: /usr/local/bin/goatcounter
      tags: goatcounter

    - name: Check if GoatCounter admin user has been created
      stat:
        path: /var/lib/goatcounter/.admin_created
      register: goatcounter_admin_marker
      tags: goatcounter

    - name: Create GoatCounter admin user
      command: >
        goatcounter db create site
        -db sqlite+/var/lib/goatcounter/goatcounter.sqlite3
        -createdb
        -vhost stats.monotrope.au
        -user.email {{ goatcounter_admin_email }}
        -user.password {{ goatcounter_admin_password }}
      become_user: goatcounter
      when: not goatcounter_admin_marker.stat.exists
      no_log: true
      tags: goatcounter

    - name: Mark GoatCounter admin user as created
      file:
        path: /var/lib/goatcounter/.admin_created
        state: touch
        owner: goatcounter
        group: goatcounter
        mode: '0600'
      when: not goatcounter_admin_marker.stat.exists
      tags: goatcounter

    - name: Install GoatCounter systemd service
      copy:
        dest: /etc/systemd/system/goatcounter.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=GoatCounter analytics
          After=network.target

          [Service]
          User=goatcounter
          Group=goatcounter
          ExecStart=/usr/local/bin/goatcounter serve \
            -listen localhost:8081 \
            -db sqlite+/var/lib/goatcounter/goatcounter.sqlite3 \
            -tls none \
            -domain stats.monotrope.au
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify: Restart GoatCounter
      tags: goatcounter

    - name: Enable and start GoatCounter
      systemd:
        name: goatcounter
        enabled: true
        state: started
        daemon_reload: true
      tags: goatcounter

    # ── Log driver migration ────────────────────────────────────────────────

    - name: Force-recreate existing compose stacks to pick up journald driver
      command: docker compose up -d --force-recreate
      args:
        chdir: "{{ item }}"
      loop:
        - /opt/miniflux
        - /opt/obsidian
        - /opt/calibre
        - /opt/koinsight
        - /opt/wallabag
      when: docker_daemon_config.changed

    # ── Unified log viewer ──────────────────────────────────────────────────

    - name: Install mlogs script
      tags: logging
      copy:
        dest: /usr/local/bin/mlogs
        owner: root
        group: root
        mode: '0755'
        content: |
          {% raw %}#!/usr/bin/env python3
          # Unified coloured tail for monotrope services on the VPS.
          # Reads journald (for Caddy, GoatCounter, and all container stdout).
          import json, os, re, subprocess, sys

          COLORS = {
              "caddy":        "\033[36m",
              "goatcounter":  "\033[35m",
              "miniflux":     "\033[32m",
              "calibre":      "\033[31m",
              "koinsight":    "\033[37m",
              "wallabag":     "\033[95m",
          }
          RESET = "\033[0m"
          ANSI = re.compile(r"\x1b\[[0-9;]*m")

          def emit(svc, msg):
              key = next((k for k in COLORS if svc.startswith(k)), None)
              color = COLORS.get(key, "\033[90m")
              print(f"{color}[{svc:<13}]{RESET} {ANSI.sub('', msg)}", flush=True)

          def tail_journal(extra):
              filters = ["_SYSTEMD_UNIT=caddy.service", "+", "_SYSTEMD_UNIT=goatcounter.service"]
              try:
                  names = subprocess.check_output(
                      ["docker", "ps", "--format", "{{.Names}}"], text=True
                  ).split()
              except Exception:
                  names = []
              for n in names:
                  filters += ["+", f"CONTAINER_NAME={n}"]
              cmd = ["journalctl", "-f", "-o", "json",
                     "--output-fields=_SYSTEMD_UNIT,CONTAINER_NAME,MESSAGE"] + filters + extra
              p = subprocess.Popen(cmd, stdout=subprocess.PIPE, text=True)
              for line in p.stdout:
                  try:
                      e = json.loads(line)
                  except Exception:
                      continue
                  svc = e.get("CONTAINER_NAME") or e.get("_SYSTEMD_UNIT", "").replace(".service", "") or "?"
                  msg = e.get("MESSAGE", "")
                  if isinstance(msg, list):
                      msg = bytes(msg).decode("utf-8", "replace")
                  emit(svc, msg)

          def main():
              extra = sys.argv[1:]
              try:
                  tail_journal(extra)
              except KeyboardInterrupt:
                  pass

          if __name__ == "__main__":
              main()
          {% endraw %}

    # ── Backups (restic to Wasabi) ───────────────────────────────────────────
    # One-shot snapshot for the VPS-to-homelab migration. The same script and
    # env file pattern will be reused on the home server with a different
    # RESTIC_REPOSITORY (NAS over LAN) and a systemd timer for nightly runs.

    - name: Install restic
      apt:
        name: restic
        state: present
      tags: backup

    - name: Stage backup script
      copy:
        src: ../backup/monotrope-backup
        dest: /usr/local/bin/monotrope-backup
        owner: root
        group: root
        mode: '0755'
      tags: backup

    - name: Stage backup environment file
      copy:
        dest: /etc/monotrope-backup.env
        owner: root
        group: root
        mode: '0600'
        content: |
          RESTIC_REPOSITORY=s3:s3.ap-southeast-2.wasabisys.com/monotrope-backup
          RESTIC_PASSWORD={{ restic_password }}
          AWS_ACCESS_KEY_ID={{ backup_wasabi_access_key_id }}
          AWS_SECRET_ACCESS_KEY={{ backup_wasabi_secret_access_key }}
      no_log: true
      tags: backup

    # ── Deploy user ──────────────────────────────────────────────────────────

    - name: Create deploy user
      user:
        name: "{{ deploy_user }}"
        create_home: true
        shell: /bin/bash
        state: present

    - name: Set up deploy user SSH directory
      file:
        path: "/home/{{ deploy_user }}/.ssh"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: '0700'

    - name: Install deploy user SSH public key
      ansible.posix.authorized_key:
        user: "{{ deploy_user }}"
        key: "{{ deploy_pubkey }}"
        state: present

    - name: Create site directory
      file:
        path: "{{ site_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: www
        mode: '0775'

  handlers:

    - name: Restart Caddy
      systemd:
        name: caddy
        state: restarted

    - name: Restart GoatCounter
      systemd:
        name: goatcounter
        state: restarted

    - name: Restart sshd
      systemd:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      systemd:
        name: fail2ban
        state: restarted

    - name: Restart WireGuard
      systemd:
        name: wg-quick@wg0
        state: restarted
