---
# Home (OptiPlex Proxmox) playbook. Roles get added as services come online.

- name: Provision Proxmox host
  hosts: proxmox_hosts
  become: true
  # force_handlers: even if a later task in this play fails, restart-style
  # handlers (caddy reload, ops-broker restart) still fire — the worst case
  # is the next `make home` re-attempts the same work, not a stale process
  # serving from old config.
  force_handlers: true
  roles:
    - proxmox_host
    - { role: proxmox_lxc_config, tags: [lxc_config] }
    - caddy
    - restic_backup
    - { role: nfs_shutdown_guard, tags: [nfs_shutdown_guard] }
    - { role: ops_broker, tags: [ops_broker] }

- name: Provision LXCs (common)
  hosts: lxcs
  become: true
  roles:
    - tailscale

- name: Provision Jellyfin LXC
  hosts: jellyfin
  become: true
  roles:
    - role: jellyfin
      jellyfin_igpu: "{{ 'igpu' in (lxc_features | default([])) }}"

- name: Provision media-stack LXC
  hosts: media-stack
  become: true
  roles:
    - docker
    - media_stack

- name: Provision apps LXC
  hosts: apps
  become: true
  force_handlers: true
  roles:
    - docker
    - role: nfs_container_guard
      tags: [nfs_container_guard]
    - calibre_web
    - audiobookshelf
    - role: audible_ingest
      tags: [audible_ingest]
    - role: libro_ingest
      tags: [libro_ingest]
    - koinsight
    - miniflux
    - role: karakeep
      tags: [karakeep]
    - role: ops_broker
      tags: [ops_broker]

- name: Provision hermes LXC
  hosts: hermes
  become: true
  roles:
    - hermes

- name: Provision pihole LXC
  hosts: pihole
  become: true
  roles:
    - docker
    - pihole

- name: Provision immich LXC
  hosts: immich
  become: true
  force_handlers: true
  roles:
    - docker
    - immich
    - role: nfs_container_guard
      tags: [nfs_container_guard]
      vars:
        nfs_guard_paths:
          - /library/photos
