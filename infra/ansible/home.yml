---
# Home (OptiPlex Proxmox) playbook. Roles get added as services come online.

- name: Provision Proxmox host
  hosts: proxmox_hosts
  become: true
  roles:
    - proxmox_host
    - proxmox_lxc_config
    - caddy

- name: Provision LXCs (common)
  hosts: lxcs
  become: true
  roles:
    - tailscale

- name: Provision Jellyfin LXC
  hosts: jellyfin
  become: true
  roles:
    - role: jellyfin
      jellyfin_igpu: "{{ 'igpu' in (lxc_features | default([])) }}"

- name: Provision media-stack LXC
  hosts: media-stack
  become: true
  roles:
    - docker
    - media_stack

- name: Provision apps LXC
  hosts: apps
  become: true
  roles:
    - docker
    - calibre_web
    - audiobookshelf
    - audible_ingest
    - koinsight
    - miniflux
    - role: ops_broker
      tags: [ops_broker]

- name: Provision hermes LXC
  hosts: hermes
  become: true
  roles:
    - hermes

- name: Provision pihole LXC
  hosts: pihole
  become: true
  roles:
    - docker
    - pihole
