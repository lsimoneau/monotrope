---
# Cross-environment non-secret config and indirection to vault.yml.
# Secrets live encrypted in the sibling vault.yml; values referenced here
# as {{ vault_* }} are decrypted at deploy time.

# ── Non-secret service config ──────────────────────────────────────────
hermes_email_allowed_users: simoneau.louis@gmail.com,louissimoneau@fastmail.com,noreply@kobo.com,louis@monotrope.au

# ── Indirection: secrets resolved from vault.yml ───────────────────────
miniflux_db_password: "{{ vault_miniflux_db_password }}"
miniflux_admin_user: "{{ vault_miniflux_admin_user }}"
miniflux_admin_password: "{{ vault_miniflux_admin_password }}"
openrouter_api_key: "{{ vault_openrouter_api_key }}"
hermes_telegram_bot_token: "{{ vault_hermes_telegram_bot_token }}"
hermes_telegram_allowed_users: "{{ vault_hermes_telegram_allowed_users }}"
hermes_miniflux_api_key: "{{ vault_hermes_miniflux_api_key }}"
hermes_email_password: "{{ vault_hermes_email_password }}"
hermes_browserbase_api_key: "{{ vault_hermes_browserbase_api_key }}"
hermes_browserbase_project_id: "{{ vault_hermes_browserbase_project_id }}"
tailscale_auth_key: "{{ vault_tailscale_auth_key }}"
cloudflare_dns_api_token: "{{ vault_cloudflare_dns_api_token }}"
proton_wg_private_key: "{{ vault_proton_wg_private_key }}"
pihole_web_password: "{{ vault_pihole_web_password }}"
# Shared bearer token: the ops-broker (server) and Hermes' mcp_servers (client)
# both reference this single source.
ops_broker_token: "{{ vault_ops_broker_token }}"
karakeep_nextauth_secret: "{{ vault_karakeep_nextauth_secret }}"
karakeep_meili_master_key: "{{ vault_karakeep_meili_master_key }}"
hermes_github_token: "{{ vault_hermes_github_token }}"
restic_password: "{{ vault_restic_password }}"
restic_wasabi_access_key_id: "{{ vault_backup_wasabi_access_key_id }}"
restic_wasabi_secret_access_key: "{{ vault_backup_wasabi_secret_access_key }}"
