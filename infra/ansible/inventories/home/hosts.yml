---
home:
  children:
    proxmox_hosts:
      hosts:
        pve:
          ansible_host: 192.168.0.59
          ansible_user: root
    lxcs:
      hosts:
        jellyfin:
          ansible_host: 192.168.0.99
          ansible_user: root
          vmid: 101
          proxmox_host: pve
          lxc_features:
            - tun
            - nas_idmap
            - igpu
        media-stack:
          ansible_host: 192.168.0.98
          ansible_user: root
          vmid: 102
          proxmox_host: pve
          lxc_features:
            - tun
            - nas_idmap
        apps:
          ansible_host: 192.168.0.97
          ansible_user: root
          vmid: 103
          proxmox_host: pve
          lxc_features:
            - tun
            - nas_idmap
          # ops-broker allowlist: friendly name → real container/unit. The agent
          # only ever names a key here; it can't reach anything else. restartable
          # is the known-safe remediation gate (postgres + ingest left off).
          ops_broker_services:
            calibre-web:    {source: docker,  target: calibre-calibre-web-1,           restartable: true}
            audiobookshelf: {source: docker,  target: audiobookshelf-audiobookshelf-1, restartable: true}
            koinsight:      {source: docker,  target: koinsight-koinsight-1,           restartable: true}
            miniflux:       {source: docker,  target: miniflux-miniflux-1,             restartable: true}
            miniflux-db:    {source: docker,  target: miniflux-db-1,                   restartable: false}
            audible-ingest: {source: docker,  target: audible-ingest-audible-ingest-1, restartable: false}
            kobo-ingest:    {source: journal, target: kobo-ingest.service,             restartable: false}
        hermes:
          ansible_host: 192.168.0.96
          ansible_user: root
          vmid: 104
          proxmox_host: pve
          lxc_features:
            - tun
        pihole:
          ansible_host: 192.168.0.95
          ansible_user: root
          vmid: 105
          proxmox_host: pve
          lxc_features:
            - tun
