---
home:
  children:
    proxmox_hosts:
      hosts:
        pve:
          ansible_host: 192.168.0.59
          ansible_user: root
          ops_broker_name: pve-ops
          ops_broker_groups:
            - systemd-journal
          ops_broker_after: "network-online.target"
          ops_broker_services:
            restic-backup: {source: journal, target: restic-backup.service, restartable: false}
            caddy:         {source: journal, target: caddy.service,         restartable: false}
            nic-tuning:    {source: journal, target: nic-tuning.service,    restartable: false}
    lxcs:
      hosts:
        jellyfin:
          ansible_host: 192.168.0.99
          ansible_user: root
          vmid: 101
          proxmox_host: pve
          lxc_features:
            - tun
            - nas_idmap
            - igpu
        media-stack:
          ansible_host: 192.168.0.98
          ansible_user: root
          vmid: 102
          proxmox_host: pve
          lxc_features:
            - tun
            - nas_idmap
        apps:
          ansible_host: 192.168.0.97
          ansible_user: root
          vmid: 103
          proxmox_host: pve
          lxc_features:
            - tun
            - nas_idmap
          # ops-broker allowlist: friendly name → real container/unit. The agent
          # only ever names a key here; it can't reach anything else. restartable
          # is the known-safe remediation gate (postgres + ingest left off).
          ops_broker_services:
            calibre-web:    {source: docker,  target: calibre-calibre-web-1,           restartable: true}
            audiobookshelf: {source: docker,  target: audiobookshelf-audiobookshelf-1, restartable: true}
            koinsight:      {source: docker,  target: koinsight-koinsight-1,           restartable: true}
            miniflux:       {source: docker,  target: miniflux-miniflux-1,             restartable: true}
            miniflux-db:    {source: docker,  target: miniflux-db-1,                   restartable: false}
            # Sidecar exec'd by a host oneshot timer: the container's own PID 1
            # is `tail -f /dev/null` (zero docker-logs output), and the sweep's
            # real output + pass/fail land in the unit journal. Source it there
            # so status reflects the last sweep, not the idle container.
            nfs-guard:      {source: journal, target: nfs-container-guard.service,     restartable: false}
            audible-ingest: {source: journal, target: audible-ingest.service,          restartable: false, triggerable: true}
            libro-ingest:   {source: journal, target: libro-ingest.service,            restartable: false, triggerable: true}
            kobo-ingest:    {source: journal, target: kobo-ingest.service,             restartable: false, triggerable: true}
            karakeep:       {source: docker,  target: karakeep-web-1,                  restartable: true}
            karakeep-chrome: {source: docker, target: karakeep-chrome-1,               restartable: true}
            karakeep-meili: {source: docker,  target: karakeep-meilisearch-1,          restartable: false}
          # read_file allowlist: friendly name → diagnostic file. The agent names
          # only a key; it never reaches the secret-bearing config.toml beside it.
          ops_broker_files:
            audible-state: {container: audible-ingest-audible-ingest-1, path: /var/lib/audible-ingest/state.json}
            libro-state:   {container: libro-ingest-libro-ingest-1,   path: /var/lib/libro-ingest/state.json}
        hermes:
          ansible_host: 192.168.0.96
          ansible_user: root
          vmid: 104
          proxmox_host: pve
          lxc_features:
            - tun
        pihole:
          ansible_host: 192.168.0.95
          ansible_user: root
          vmid: 105
          proxmox_host: pve
          # Started by hand only: it is not yet the LAN's resolver (the HA plan
          # in roles/pihole/HA-PLAN.md gates that on a second node), and the
          # LXCs take DNS from DHCP, so an unattended start buys nothing.
          lxc_onboot: false
          lxc_features:
            - tun
