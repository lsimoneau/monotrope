[project]
name = "broker_core"
version = "0.1.0"
description = "Shared, audited scaffold for narrow MCP capability brokers exposed to Hermes Agent"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["broker_core"]
